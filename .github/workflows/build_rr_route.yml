name: Build NR package (RR route + NVFP4 hybrid)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version label'
        required: true
        default: '0.8.3-rr'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      - name: Apply source overlay (nr-rr-route-overlay.zip in the repo root, if present)
        shell: powershell
        run: |
          if (Test-Path -LiteralPath 'nr-rr-route-overlay.zip') {
            Expand-Archive -LiteralPath 'nr-rr-route-overlay.zip' -DestinationPath '.' -Force
            Write-Output 'Overlay applied.'
          } else {
            Write-Output 'No overlay zip found; building the committed tree.'
          }
      - name: Remove retired files from earlier overlays (async / temporal reuse)
        shell: pwsh
        run: |
          $retired = @(
            'OptiScaler/shaders/dlssnr/DlssNr_Dx12_Async.cpp',
            'OptiScaler/shaders/dlssnr/DlssNr_Dx12_Temporal.cpp',
            'OptiScaler/shaders/dlssnr/DlssNr_Temporal_Dx12.cpp',
            'OptiScaler/shaders/dlssnr/DlssNr_Temporal_Dx12.h',
            'OptiScaler/shaders/dlssnr/precompile/dlssnr_temporal.hlsl',
            'OptiScaler/shaders/dlssnr/precompile/dlssnr_temporal_Shader.h',
            'OptiScaler/shaders/dlssnr/precompile/dlssnr_temporal_Shader.cso',
            'OptiScaler/dlssnr/DlssNr_MenuTemporal.cpp',
            'OptiScaler/shaders/dlssnr/DlssNr_Dx12_Register.cpp',
            'OptiScaler/dlssnr/DlssNr_AsyncStatus.h')
          foreach ($f in $retired) { if (Test-Path $f) { Remove-Item $f -Force; Write-Host "removed $f" } }
      - name: Compile the NR resolve shader (fxc, cs_5_0, entry CSMain)
        shell: powershell
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found in the Windows SDK' }
          $dir = 'OptiScaler\shaders\dlssnr\precompile'
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { throw "fxc failed with $LASTEXITCODE" }
          $bytes = [System.IO.File]::ReadAllBytes("$dir\DlssNr_Shader.cso")
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.Append("#pragma once`n`ninline static const unsigned char DlssNr_cso[] = {`n")
          for ($i = 0; $i -lt $bytes.Length; $i += 12) {
            $chunk = $bytes[$i..([Math]::Min($i + 11, $bytes.Length - 1))] | ForEach-Object { '0x{0:x2}' -f $_ }
            [void]$sb.Append('    ' + ($chunk -join ', ') + ", `n")
          }
          [void]$sb.Append("};`n")
          [System.IO.File]::WriteAllText("$dir\DlssNr_Shader.h", $sb.ToString())
          Write-Output ("Compiled dlssnr.hlsl: {0} bytes" -f $bytes.Length)
          # Residual (accumulate/apply) shader and finished-colour shader, same treatment.
          foreach ($pair in @(@('dlssnr_residual.hlsl', 'dlssnr_residual_Shader', 'dlssnr_residual_cso'),
                              @('dlssnr_finished_color.hlsl', 'dlssnr_finished_color_Shader', 'dlssnr_finished_color_cso'))) {
            $src = $pair[0]; $stem = $pair[1]; $sym = $pair[2]
            & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\$stem.cso" "$dir\$src"
            if ($LASTEXITCODE -ne 0) { throw "fxc failed on $src with $LASTEXITCODE" }
            $b = [System.IO.File]::ReadAllBytes("$dir\$stem.cso")
            $s2 = New-Object System.Text.StringBuilder
            [void]$s2.Append("#pragma once`n`ninline static const unsigned char $sym[] = {`n")
            for ($i = 0; $i -lt $b.Length; $i += 12) {
              $chunk = $b[$i..([Math]::Min($i + 11, $b.Length - 1))] | ForEach-Object { '0x{0:x2}' -f $_ }
              [void]$s2.Append('    ' + ($chunk -join ', ') + ", `n")
            }
            [void]$s2.Append("};`n")
            [System.IO.File]::WriteAllText("$dir\$stem.h", $s2.ToString())
            Write-Output ("Compiled {0}: {1} bytes" -f $src, $b.Length)
          }
      - name: Restore the compiled objects from the previous run
        uses: actions/cache@v4
        with:
          path: OptiScaler/x64/Release
          key: nr-objects-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nr-objects-${{ runner.os }}-
      - name: Age the unchanged sources so MSBuild recompiles only what changed
        shell: pwsh
        run: |
          $shaFile = 'OptiScaler/x64/Release/.built-from'
          if (-not (Test-Path $shaFile)) { Write-Output 'No cached build: full compile.'; exit 0 }
          $base = (Get-Content $shaFile -Raw).Trim()
          $changed = @{}
          $diff = git diff --name-only $base HEAD 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Output 'Base commit unknown: full compile.'; exit 0 }
          $diff | ForEach-Object { if ($_) { $changed[$_.Replace('\','/')] = $true } }
          # Files the overlay step changed or added in the working tree count as changed too.
          git status --porcelain --untracked-files=all | ForEach-Object {
            if ($_.Length -gt 3) { $changed[$_.Substring(3).Trim().Trim('"').Replace('\','/')] = $true }
          }
          $old = [datetime]'2000-01-01'
          $now = Get-Date
          $aged = 0
          git ls-files | ForEach-Object {
            $f = $_.Replace('\','/')
            if (-not (Test-Path $f)) { return }
            if ($changed.ContainsKey($f)) { (Get-Item $f).LastWriteTime = $now }
            else { (Get-Item $f).LastWriteTime = $old; $aged++ }
          }
          foreach ($f in $changed.Keys) { if (Test-Path $f) { (Get-Item $f).LastWriteTime = $now } }
          Write-Output ("Aged {0} unchanged files; {1} changed since {2}" -f $aged, $changed.Count, $base)
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Package
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./package_release.ps1 -Version $env:PACKAGE_VERSION
      - name: Remember which commit the objects were built from
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OptiScaler/x64/Release | Out-Null
          (git rev-parse HEAD).Trim() | Set-Content -NoNewline OptiScaler/x64/Release/.built-from
      - name: Bundle the NVFP4 hybrid assets (nvfp4.zip in the repo root, if present)
        shell: pwsh
        run: |
          if (-not (Test-Path 'nvfp4.zip')) { Write-Host 'No nvfp4.zip in the repo; the package ships without hybrid assets'; exit 0 }
          $pkg = Get-ChildItem -Path 'release' -Filter '*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $pkg) { throw 'Package zip not found in release/' }
          $work = Join-Path $env:RUNNER_TEMP 'pkg'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          Expand-Archive -LiteralPath $pkg.FullName -DestinationPath $work -Force
          $optiDir = Get-ChildItem -Path $work -Directory -Recurse -Filter 'OptiScaler' | Select-Object -First 1
          if (-not $optiDir) { $optiDir = New-Item -ItemType Directory -Path (Join-Path $work 'OptiScaler') }
          $dest = Join-Path $optiDir.FullName 'nvfp4'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          $tmp = Join-Path $env:RUNNER_TEMP 'nvfp4src'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath 'nvfp4.zip' -DestinationPath $tmp -Force
          $src = Get-ChildItem -Path $tmp -Directory -Recurse -Filter 'nvfp4' | Select-Object -First 1
          if (-not $src) { throw 'nvfp4.zip does not contain an nvfp4 folder' }
          Copy-Item -Path $src.FullName -Destination $dest -Recurse
          Remove-Item $pkg.FullName -Force
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $pkg.FullName -Force
          Write-Host ("Bundled {0} hybrid assets into {1}" -f (Get-ChildItem $dest -Recurse -File).Count, $pkg.Name)
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-${{ inputs.version }}
          path: release/*.zip
          if-no-files-found: error
