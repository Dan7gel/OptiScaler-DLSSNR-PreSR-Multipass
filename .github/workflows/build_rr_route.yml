name: Build NR package (RR route + NVFP4 hybrid)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version label'
        required: true
        default: '0.8.3-rr'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Apply source overlay (nr-rr-route-overlay.zip in the repo root, if present)
        shell: powershell
        run: |
          if (Test-Path -LiteralPath 'nr-rr-route-overlay.zip') {
            Expand-Archive -LiteralPath 'nr-rr-route-overlay.zip' -DestinationPath '.' -Force
            Write-Output 'Overlay applied.'
          } else {
            Write-Output 'No overlay zip found; building the committed tree.'
          }
      - name: Compile the NR resolve shader (fxc, cs_5_0, entry CSMain)
        shell: powershell
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found in the Windows SDK' }
          $dir = 'OptiScaler\shaders\dlssnr\precompile'
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\DlssNr_Shader.cso" "$dir\dlssnr.hlsl"
          if ($LASTEXITCODE -ne 0) { throw "fxc failed with $LASTEXITCODE" }
          $bytes = [System.IO.File]::ReadAllBytes("$dir\DlssNr_Shader.cso")
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.Append("#pragma once`n`ninline static const unsigned char DlssNr_cso[] = {`n")
          for ($i = 0; $i -lt $bytes.Length; $i += 12) {
            $chunk = $bytes[$i..([Math]::Min($i + 11, $bytes.Length - 1))] | ForEach-Object { '0x{0:x2}' -f $_ }
            [void]$sb.Append('    ' + ($chunk -join ', ') + ", `n")
          }
          [void]$sb.Append("};`n")
          [System.IO.File]::WriteAllText("$dir\DlssNr_Shader.h", $sb.ToString())
          Write-Output ("Compiled dlssnr.hlsl: {0} bytes" -f $bytes.Length)
          # Temporal reuse shader (ULTIMATE77), same treatment.
          & $fxc.FullName /nologo /T cs_5_0 /E CSMain /O3 /Fo "$dir\dlssnr_temporal_Shader.cso" "$dir\dlssnr_temporal.hlsl"
          if ($LASTEXITCODE -ne 0) { throw "fxc failed on dlssnr_temporal.hlsl with $LASTEXITCODE" }
          $tbytes = [System.IO.File]::ReadAllBytes("$dir\dlssnr_temporal_Shader.cso")
          $tsb = New-Object System.Text.StringBuilder
          [void]$tsb.Append("#pragma once`n`ninline static const unsigned char dlssnr_temporal_cso[] = {`n")
          for ($i = 0; $i -lt $tbytes.Length; $i++) {
            [void]$tsb.Append(("0x{0:x2}," -f $tbytes[$i]))
            if (($i % 16) -eq 15) { [void]$tsb.Append("`n") }
          }
          [void]$tsb.Append("`n};`n")
          [System.IO.File]::WriteAllText("$dir\dlssnr_temporal_Shader.h", $tsb.ToString())
          Write-Output ("Compiled dlssnr_temporal.hlsl: {0} bytes" -f $tbytes.Length)
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Package
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./package_release.ps1 -Version $env:PACKAGE_VERSION
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-${{ inputs.version }}
          path: release/*.zip
          if-no-files-found: error
